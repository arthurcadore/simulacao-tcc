site_name: ARGOS-3 Simulator
site_url: "https://github.com/arthurcadore/simulacao-tcc"

repo_name: simulacao-tcc
repo_url: https://github.com/arthurcadore/simulacao-tcc
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon.svg
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.tabs
    - header.autohide
    - search.suggest
    - search.highlight
    - toc.integrate
    - content.code.copy
    - content.code.highlight
    - content.tooltips
    - navigation.expand
    - navigation.top
    - repository.icon 
  icon:
    repo: fontawesome/brands/github 

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - site/hide_sidebar.js
  
extra_css:
  - site/styles.css

nav:
  - Home: index.md
  - Installation: 
      - Installation pip: guide_pip.md
      - Installation manual: guide.md
      - Changelog: changelog.md
  - Components:
      - Datagram: api/datagram.md
      - Convolutional Encoder: api/convolutional.md
      - Scrambler: api/scrambler.md
      - Preamble: api/preamble.md
      - Multiplexer: api/multiplexer.md
      - Line Encoder: api/encoder.md
      - Pulse Modulate: api/formatter.md
      - Bandpass Modulate: api/modulator.md
      - Detector: api/detector.md
      - Low Pass Filter: api/lpf.md
      - Matched Filter: api/matchedfilter.md
      - Synchronizer: api/synchronizer.md
      - Sampler: api/sampler.md
  - Transmitter: api/transmitter.md
  - Channel: 
      - Channel: api/channel.md
      - SNR Noise: api/noiseSNR.md
      - EB/N0 Noise: api/noiseEBN0.md
  - Receiver: api/receiver.md
  - Extras: 
      - BER vs SNR: api/bersnr.md
      - Plotter: api/plots.md
      - Data Import/Export: api/data.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src/argos3]
          options:
            show_source: false
            show_submodules: true
            members_order: source

badges: 
  - name: Stars 
    image: https://img.shields.io/github/stars/arthurcadore/simulacao-tcc?style=social 
    link: https://github.com/arthurcadore/simulacao-tcc/stargazers 
  - name: Forks 
    image: https://img.shields.io/github/forks/arthurcadore/simulacao-tcc?style=social 
    link: https://github.com/arthurcadore/simulacao-tcc/network/members 
  - name: Release
    image: https://img.shields.io/github/v/release/arthurcadore/simulacao-tcc?style=flat
    link: https://github.com/arthurcadore/simulacao-tcc/releases/latest
    
markdown_extensions:
  - pymdownx.arithmatex:  
      generic: true
  - toc:  
  - admonition:
